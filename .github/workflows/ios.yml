name: iOS Build & TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA and upload to TestFlight
    runs-on: macos-latest

    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: https://github.com/YOUSSEFELHAMDANI/veraapp-certs.git
      FASTLANE_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      ASC_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_INFO_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "GoogleService-Info.plist restored"

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Fastlane
        run: sudo gem install fastlane -N

      - name: Write App Store Connect API key JSON
        run: |
          python3 -c "
          import json, os
          payload = {
            'key_id': os.environ['APP_STORE_CONNECT_API_KEY_ID'],
            'issuer_id': os.environ['APP_STORE_CONNECT_API_ISSUER_ID'],
            'key': os.environ['ASC_API_KEY_CONTENT'],
            'in_house': False,
          }
          with open('/tmp/asc_key.json', 'w') as f:
            json.dump(payload, f)
          "
          echo "asc_key.json written"

      - name: Match (certificates + provisioning)
        run: |
          git config --global url."https://x-access-token:${{ secrets.MATCH_GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          fastlane match appstore \
            --api_key_path /tmp/asc_key.json \
            --app_identifier app.veraapp.com \
            --type appstore \
            --force

      - name: Inject DEVELOPMENT_TEAM into pbxproj
        run: |
          python3 - <<'EOF'
          import json, jwt, time, urllib.request
          with open('/tmp/asc_key.json') as f:
              cfg = json.load(f)
          headers = {
              "alg": "ES256", "kid": cfg["key_id"], "typ": "JWT",
          }
          claims = {
              "iss": cfg["issuer_id"],
              "iat": int(time.time()),
              "exp": int(time.time()) + 900,
              "aud": "appstoreconnect-v1",
          }
          token = jwt.encode(claims, cfg["key"], algorithm="ES256", headers=headers)
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=app.veraapp.com",
              headers={"Authorization": f"Bearer {token}"})
          data = json.load(urllib.request.urlopen(req))
          team_id = data["data"][0]["attributes"]["seedId"]
          print(f"TEAM_ID={team_id}")
          with open('/tmp/TEAM_ID', 'w') as f:
              f.write(team_id)
          EOF
          TEAM_ID=$(cat /tmp/TEAM_ID)
          sed -i '' "s|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;\n\t\t\t\tDEVELOPMENT_TEAM = $TEAM_ID;|g" ios/Runner.xcodeproj/project.pbxproj
          echo "Injected. Count:"
          grep -c "DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj

      - name: Build IPA
        run: flutter build ipa --release --build-name=1.0.2 --build-number=3 --export-method app-store

      - name: Upload to TestFlight
        run: |
          fastlane pilot upload \
            --api_key_path /tmp/asc_key.json \
            --ipa build/ios/ipa/vera.ipa \
            --skip_waiting_for_build_processing true

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vera-ipa
          path: build/ios/ipa/
          if-no-files-found: ignore