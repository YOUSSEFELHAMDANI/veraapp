name: iOS Build & TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA and upload to TestFlight
    runs-on: macos-latest

    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: https://github.com/YOUSSEFELHAMDANI/veraapp-certs.git
      FASTLANE_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      ASC_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_INFO_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "GoogleService-Info.plist restored"

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Fastlane
        run: sudo gem install fastlane -N

      - name: Write App Store Connect API key JSON
        run: |
          python3 -c "
          import json, os
          payload = {
            'key_id': os.environ['APP_STORE_CONNECT_API_KEY_ID'],
            'issuer_id': os.environ['APP_STORE_CONNECT_API_ISSUER_ID'],
            'key': os.environ['ASC_API_KEY_CONTENT'],
            'in_house': False,
          }
          with open('/tmp/asc_key.json', 'w') as f:
            json.dump(payload, f)
          "
          echo "asc_key.json written"

      - name: Match (certificates + provisioning)
        run: |
          git config --global url."https://x-access-token:${{ secrets.MATCH_GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          fastlane match appstore \
            --api_key_path /tmp/asc_key.json \
            --app_identifier app.veraapp.com \
            --type appstore \
            --output-path /tmp/match_profiles \
            --force

      - name: Inject DEVELOPMENT_TEAM into pbxproj
        run: |
          PROFILE=$(find /tmp/match_profiles -name '*.mobileprovision' | head -1)
          echo "Using profile: $PROFILE"
          security cms -D -i "$PROFILE" > /tmp/profile.plist
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          echo "TEAM_ID=$TEAM_ID"
          echo "PROFILE_NAME=$PROFILE_NAME"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/match_profiles/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "Profiles installed:"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/
          sed -i '' "s|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;\n\t\t\t\tDEVELOPMENT_TEAM = $TEAM_ID;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";|g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s|CODE_SIGN_STYLE = Automatic;|CODE_SIGN_STYLE = Manual;|g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's|"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";|"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";|g' ios/Runner.xcodeproj/project.pbxproj
          echo "CODE_SIGN_STYLE count:"
          grep -c "CODE_SIGN_STYLE" ios/Runner.xcodeproj/project.pbxproj
          echo "CODE_SIGN_IDENTITY lines:"
          grep "CODE_SIGN_IDENTITY" ios/Runner.xcodeproj/project.pbxproj

      - name: Write export options plist
        run: |
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist)
          cat > /tmp/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
          </dict>
          </plist>
          EOF
          echo "export options written"

      - name: Build IPA
        run: flutter build ipa --release --build-name=1.0.2 --build-number=3 --export-options-plist=/tmp/export_options.plist

      - name: Upload to TestFlight
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA=$IPA"
          fastlane pilot upload \
            --api_key_path /tmp/asc_key.json \
            --ipa "$IPA" \
            --skip_waiting_for_build_processing true

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vera-ipa
          path: build/ios/ipa/
          if-no-files-found: ignore